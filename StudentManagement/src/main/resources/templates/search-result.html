<!DOCTYPE html>
<html>
<head>
    <title>Search Result</title>
</head>
<body>

<h1>Search Result</h1>

<div th:if="${student != null}">

    <p>
        Register Number:
        <span th:text="${student.regno}"></span>
    </p>

    <p>
        Name:
        <span th:text="${student.name}"></span>
    </p>

    <p>
        CGPA:
        <span th:text="${student.cgpa}"></span>
    </p>

</div>

<div th:if="${student == null}">

    <p>Student not found.</p>

</div>

<br>

<a href="/">Back to Home</a>

</body>
</html>
